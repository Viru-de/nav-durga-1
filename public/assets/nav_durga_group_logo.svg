<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=Rajdhani:wght@700;800&amp;display=swap');
      .tricolor-saffron { fill: #FF671F; }
      .tricolor-white { fill: #FFFFFF; }
      .tricolor-green { fill: #046A38; }
      .emblem-orange { fill: #EA580C; }
      .emblem-black { fill: #111827; }
      .emblem-white { fill: #FFFFFF; }
      .text-black { fill: #111827; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 900; }
      .text-green { fill: #00843D; font-family: 'Rajdhani', 'Plus Jakarta Sans', sans-serif; font-weight: 800; }
      .text-group { fill: #111827; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 800; letter-spacing: 0.18em; }
    </style>
    <clipPath id="card-clip">
      <rect width="600" height="400" rx="12" />
    </clipPath>
  </defs>

  <!-- Clean Off-White Background Card (as in official master photo) -->
  <rect width="600" height="400" rx="12" fill="#FCFCFA" />

  <g clip-path="url(#card-clip)">
    <!-- Top-Left Tricolor Diagonal Ribbon -->
    <!-- Saffron Stripe -->
    <polygon points="-40,120 180,-100 230,-100 -40,170" fill="#FF671F" />
    <!-- White Stripe with subtle outline -->
    <polygon points="-40,170 230,-100 280,-100 -40,220" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75" />
    <!-- Green Stripe -->
    <polygon points="-40,220 280,-100 330,-100 -40,270" fill="#046A38" />
  </g>

  <!-- Top Center Emblem: Nav Durga Geometric Chevron & Diamond -->
  <g transform="translate(370, 75)">
    <!-- Upper Orange Chevron / Arrow pointing up -->
    <path d="M 0,-52 L 48,-6 L 30,12 L 0,-18 L -30,12 L -48,-6 Z" fill="#EA580C" />
    <!-- Center Black Diamond -->
    <polygon points="0,-10 26,16 0,42 -26,16" fill="#111827" />
    <!-- Center White Eye / Dot -->
    <circle cx="0" cy="16" r="6" fill="#FFFFFF" />
    <!-- Lower Orange Inverted Point -->
    <polygon points="0,46 14,32 18,36 0,54 -18,36 -14,32" fill="#EA580C" />
  </g>

  <!-- Wordmark Line 1: NAV (Bold Black Geometric Sans) -->
  <g transform="translate(180, 195)">
    <!-- N -->
    <path d="M -90,0 L -90,-62 L -74,-62 L -48,-22 L -48,-62 L -32,-62 L -32,0 L -48,0 L -74,-40 L -74,0 Z" fill="#111827" />
    <!-- A -->
    <path d="M -16,0 L 5,-62 L 23,-62 L 44,0 L 26,0 L 21,-16 L 7,-16 L 2,0 Z M 11,-29 L 17,-29 L 14,-46 Z" fill="#111827" />
    <!-- V -->
    <path d="M 52,-62 L 69,-62 L 85,-12 L 101,-62 L 118,-62 L 94,0 L 76,0 Z" fill="#111827" />
  </g>

  <!-- Wordmark Line 2: DURGA (Distinctive Bold Green Geometric Font) -->
  <g transform="translate(85, 290)">
    <!-- D -->
    <path d="M 0,0 L 0,-64 L 46,-64 C 64,-64 74,-52 74,-32 C 74,-12 64,0 46,0 Z M 20,-16 L 44,-16 C 52,-16 54,-22 54,-32 C 54,-42 52,-48 44,-48 L 20,-48 Z" fill="#00843D" />
    <!-- U -->
    <path d="M 94,-64 L 114,-64 L 114,-22 C 114,-14 118,-10 128,-10 C 138,-10 142,-14 142,-22 L 142,-64 L 162,-64 L 162,-20 C 162,-4 150,0 128,0 C 106,0 94,-4 94,-20 Z" fill="#00843D" />
    <!-- R -->
    <path d="M 182,0 L 182,-64 L 228,-64 C 246,-64 254,-54 254,-40 C 254,-30 248,-24 238,-20 L 256,0 L 232,0 L 218,-18 L 202,-18 L 202,0 Z M 202,-32 L 226,-32 C 232,-32 234,-35 234,-40 C 234,-45 232,-48 226,-48 L 202,-48 Z" fill="#00843D" />
    <!-- G -->
    <path d="M 346,-64 L 346,-48 L 302,-48 C 294,-48 292,-44 292,-32 C 292,-20 294,-16 302,-16 L 330,-16 L 330,-28 L 314,-28 L 314,-42 L 350,-42 L 350,0 C 334,0 286,0 272,-14 C 264,-22 272,-42 272,-42 C 272,-42 274,-56 290,-62 C 302,-64 346,-64 346,-64 Z" fill="#00843D" />
    <!-- A -->
    <path d="M 370,0 L 392,-64 L 416,-64 L 438,0 L 418,0 L 413,-16 L 395,-16 L 390,0 Z M 399,-30 L 409,-30 L 404,-48 Z" fill="#00843D" />
  </g>

  <!-- Wordmark Line 3: — GROUP — (Black Uppercase with clean horizontal rules) -->
  <g transform="translate(300, 360)">
    <!-- Left Dash -->
    <line x1="-240" y1="-8" x2="-130" y2="-8" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    <!-- Text GROUP -->
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" letter-spacing="0.28em" fill="#111827">GROUP</text>
    <!-- Right Dash -->
    <line x1="130" y1="-8" x2="240" y2="-8" stroke="#111827" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>

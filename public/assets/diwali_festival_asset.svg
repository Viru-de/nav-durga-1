<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0812"/>
      <stop offset="35%" stop-color="#4a0e17"/>
      <stop offset="70%" stop-color="#6a151e"/>
      <stop offset="100%" stop-color="#20050b"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe993"/>
      <stop offset="30%" stop-color="#f5c242"/>
      <stop offset="60%" stop-color="#e09d18"/>
      <stop offset="85%" stop-color="#f9db78"/>
      <stop offset="100%" stop-color="#b87b0a"/>
    </linearGradient>

    <!-- Flame Inner/Outer Glow -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3b00"/>
      <stop offset="40%" stop-color="#ff8c00"/>
      <stop offset="80%" stop-color="#ffea00"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff4500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 3:1 Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Outer Golden Border -->
  <rect x="16" y="16" width="1168" height="368" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 4" opacity="0.8"/>
  <rect x="24" y="24" width="1152" height="352" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Left Mandala Motif -->
  <g transform="translate(140, 200)" opacity="0.25">
    <circle r="120" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle r="90" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="60" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <path d="M -120 0 L 120 0 M 0 -120 L 0 120 M -85 -85 L 85 85 M -85 85 L 85 -85" stroke="url(#goldGrad)" stroke-width="1"/>
  </g>

  <!-- Right Mandala Motif -->
  <g transform="translate(1060, 200)" opacity="0.25">
    <circle r="120" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle r="90" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="60" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <path d="M -120 0 L 120 0 M 0 -120 L 0 120 M -85 -85 L 85 85 M -85 85 L 85 -85" stroke="url(#goldGrad)" stroke-width="1"/>
  </g>

  <!-- Sparkles/Stars -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M 220 70 Q 220 90 200 90 Q 220 90 220 110 Q 220 90 240 90 Q 220 90 220 70 Z"/>
    <path d="M 980 70 Q 980 90 960 90 Q 980 90 980 110 Q 980 90 1000 90 Q 980 90 980 70 Z"/>
    <path d="M 180 310 Q 180 325 165 325 Q 180 325 180 340 Q 180 325 195 325 Q 180 325 180 310 Z"/>
    <path d="M 1020 310 Q 1020 325 1005 325 Q 1020 325 1020 340 Q 1020 325 1035 325 Q 1020 325 1020 310 Z"/>
  </g>

  <!-- Left Diya -->
  <g transform="translate(180, 210)">
    <circle cx="0" cy="-35" r="45" fill="url(#flameGlow)"/>
    <!-- Flame -->
    <path d="M 0 -70 C 15 -45 12 -25 0 -15 C -12 -25 -15 -45 0 -70 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
    <!-- Diya Base -->
    <path d="M -45 -15 Q 0 35 45 -15 Q 25 -5 0 -5 Q -25 -5 -45 -15 Z" fill="url(#goldGrad)"/>
    <path d="M -25 5 Q 0 25 25 5" fill="none" stroke="#5a0b12" stroke-width="2"/>
  </g>

  <!-- Right Diya -->
  <g transform="translate(1020, 210)">
    <circle cx="0" cy="-35" r="45" fill="url(#flameGlow)"/>
    <!-- Flame -->
    <path d="M 0 -70 C 15 -45 12 -25 0 -15 C -12 -25 -15 -45 0 -70 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
    <!-- Diya Base -->
    <path d="M -45 -15 Q 0 35 45 -15 Q 25 -5 0 -5 Q -25 -5 -45 -15 Z" fill="url(#goldGrad)"/>
    <path d="M -25 5 Q 0 25 25 5" fill="none" stroke="#5a0b12" stroke-width="2"/>
  </g>

  <!-- Center Typography & Branding Area -->
  <g text-anchor="middle">
    <!-- Eyebrow Tag -->
    <text x="600" y="115" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" letter-spacing="6">
      FESTIVAL OF LIGHTS • SPECIAL EDITION
    </text>

    <!-- Main Title: HAPPY DIWALI -->
    <text x="600" y="210" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', 'Cinzel', serif" font-size="82" font-weight="900" letter-spacing="4" filter="url(#glow)">
      HAPPY DIWALI
    </text>

    <!-- Subtitle -->
    <text x="600" y="260" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" letter-spacing="2" opacity="0.95">
      Wishing You Prosperity, Happiness &amp; Success
    </text>

    <!-- Decorative Divider Line -->
    <path d="M 420 285 L 780 285" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="120 10 120"/>
    <circle cx="600" cy="285" r="4" fill="url(#goldGrad)"/>

    <!-- Bottom Tagline -->
    <text x="600" y="325" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="4" opacity="0.9">
      PREMIUM STEEL &amp; INDUSTRIAL PRODUCTS
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <!-- Nav Durga Group Official Master Logo Asset -->
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <g id="nav-durga-master-logo" filter="url(#subtle-shadow)">
    <!-- 1. Top Orange Chevron / Diamond -->
    <path d="M 250,18 L 296,62 L 278,80 L 250,52 L 222,80 L 204,62 Z" fill="#f97316" />

    <!-- 2. Lower Black Diamond with Inner Window -->
    <path d="M 250,62 L 292,104 L 250,146 L 208,104 Z" fill="#0f172a" />
    <!-- White diamond window cutout -->
    <path d="M 250,80 L 274,104 L 250,128 L 226,104 Z" fill="#ffffff" />
    <!-- Center solid black core diamond -->
    <path d="M 250,91 L 263,104 L 250,117 L 237,104 Z" fill="#0f172a" />

    <!-- 3. "NAV" Typography -->
    <text x="250" y="194"
          text-anchor="middle"
          fill="#0f172a"
          font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-size="52"
          letter-spacing="14">NAV</text>

    <!-- 4. "DURGA" Typography in Industrial Green -->
    <text x="250" y="248"
          text-anchor="middle"
          fill="#15803d"
          font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-size="54"
          letter-spacing="6">DURGA</text>

    <!-- 5. "— GROUP —" Divider and Text -->
    <!-- Left Divider Line -->
    <line x1="105" y1="275" x2="160" y2="275" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <!-- GROUP Text -->
    <text x="250" y="282"
          text-anchor="middle"
          fill="#0f172a"
          font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800"
          font-size="24"
          letter-spacing="8">GROUP</text>
    <!-- Right Divider Line -->
    <line x1="340" y1="275" x2="395" y2="275" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

    <!-- 6. Tagline: "We build the nation" flanked by Indian Tricolor Flags -->
    <!-- Left Mini Flag -->
    <g transform="translate(85, 305)">
      <rect x="0" y="0" width="34" height="6.5" fill="#f97316" rx="1" />
      <rect x="0" y="6.5" width="34" height="6.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.3" />
      <circle cx="17" cy="9.75" r="2.2" fill="#1e3a8a" />
      <rect x="0" y="13" width="34" height="6.5" fill="#15803d" rx="1" />
    </g>

    <!-- Tagline Text -->
    <text x="250" y="322"
          text-anchor="middle"
          fill="#dc2626"
          font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800"
          font-size="20"
          letter-spacing="2">We build the nation</text>

    <!-- Right Mini Flag -->
    <g transform="translate(381, 305)">
      <rect x="0" y="0" width="34" height="6.5" fill="#f97316" rx="1" />
      <rect x="0" y="6.5" width="34" height="6.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.3" />
      <circle cx="17" cy="9.75" r="2.2" fill="#1e3a8a" />
      <rect x="0" y="13" width="34" height="6.5" fill="#15803d" rx="1" />
    </g>
  </g>
</svg>
